name: Build AyuMode DEX & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform & Build Tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Compile Java Sources
        run: |
          mkdir -p build/classes
          javac -source 8 -target 8 \
            -cp "$ANDROID_HOME/platforms/android-34/android.jar" \
            -d build/classes \
            src/main/java/com/exterawkey/ayumode/*.java

      - name: Build classes.dex using d8
        run: |
          mkdir -p build/dex
          $ANDROID_HOME/build-tools/34.0.0/d8 \
            --min-api 21 \
            --output build/dex/ \
            $(find build/classes -name "*.class")
          cp build/dex/classes.dex ./classes.dex
          cp build/dex/classes.dex plugin/classes.dex

      - name: Package Plugin Archive
        run: |
          cd plugin && zip -r ../AyuMode.zip ./* && cd ..

      - name: Upload classes.dex Artifact
        uses: actions/upload-artifact@v4
        with:
          name: classes.dex
          path: classes.dex

      - name: Upload AyuMode Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuMode-Bundle
          path: |
            classes.dex
            plugin/ayumode.plugin
            plugin/ayumode.py

      - name: Create GitHub Release on Tag or Dispatch
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            classes.dex
            AyuMode.zip
            plugin/ayumode.plugin
          generate_release_notes: true
