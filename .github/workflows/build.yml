name: Build classes.dex & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build classes.dex with D8
        run: |
          echo "Detecting preinstalled Android SDK..."
          ANDROID_JAR=$(find /usr/local/lib/android/sdk/platforms -name "android.jar" | sort -V | tail -n 1)
          D8_TOOL=$(find /usr/local/lib/android/sdk/build-tools -name "d8" | sort -V | tail -n 1)
          
          if [ -z "$ANDROID_JAR" ]; then
            ANDROID_JAR=$(find $ANDROID_HOME/platforms -name "android.jar" | sort -V | tail -n 1)
          fi
          
          if [ -z "$D8_TOOL" ]; then
            D8_TOOL=$(find $ANDROID_HOME/build-tools -name "d8" | sort -V | tail -n 1)
          fi

          echo "Using android.jar: $ANDROID_JAR"
          echo "Using d8: $D8_TOOL"

          mkdir -p build/classes
          javac -source 8 -target 8 \
            -cp "$ANDROID_JAR" \
            -d build/classes \
            $(find src/main/java -name "*.java")

          mkdir -p build/dex
          "$D8_TOOL" --min-api 21 --output build/dex/ $(find build/classes -name "*.class")
          cp build/dex/classes.dex ./classes.dex

      - name: Upload classes.dex Artifact
        uses: actions/upload-artifact@v4
        with:
          name: classes.dex
          path: classes.dex

      - name: Publish Release (DEX Only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "AyuMode DEX (Latest Build)"
          body: "Автоматическая сборка classes.dex для плагина AyuMode."
          files: classes.dex
